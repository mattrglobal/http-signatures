name: cd-libraries-gh

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build and publish from"
        required: false
        default: ""
  push:
    branches:
      - master

jobs:
  release-github-packages:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'chore(release)')"

    name: Publish to GitHub Packages
    runs-on: [self-hosted, linux, x64, engineering]
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: mattrinternal/sre-reusable-action/actions/checkout@master
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup nodejs
        uses: mattrinternal/sre-reusable-action/actions/setup-node@master
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Setup nodejs for GitHub Packages
        uses: mattrinternal/sre-reusable-action/actions/setup-node@master
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mattrinternal"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name.split('/')[1]")
          npm pkg set name="@mattrinternal/${PACKAGE_NAME}"
          npm pkg delete scripts
          npm publish
