name: cd-libraries-gh

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build and publish from"
        required: false
        default: ""
  push:
    branches:
      - master

jobs:
  release-github-packages:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'chore(release)')"

    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken "${GH_TOKEN}"
          npm publish --registry https://npm.pkg.github.com || echo "Already published at this version, skipping"
