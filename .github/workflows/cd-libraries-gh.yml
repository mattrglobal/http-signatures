## This workflow file is a WIP for the https://mattrglobal.atlassian.net/browse/DVP-11784 work where im looking at moving us off NPMJS, this is only to be used as a manual dispatch for now whilst testing

name: cd-libraries-gh

on:
  workflow_dispatch:

jobs:
  release-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # pin@v5.0.0

      # Yarn 4 ignores .npmrc, so pointing this at GitHub Packages up front only
      # affects the npm publish step below - the install still resolves from the
      # npmRegistryServer set in .yarnrc.yml.
      - name: Setup nodejs
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # pin@v5.0.0
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mattrglobal"
          # Corepack is enabled in the next step, so setup-node must not probe the
          # global Yarn 1 for a cache dir - it errors on "packageManager": "yarn@4".
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Build
        run: |
          yarn install --immutable
          yarn build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm pkg set version="$(node -p "require('./package.json').version")-ghp-pilot.${{ github.run_number }}"
          npm publish --tag ghp-pilot
