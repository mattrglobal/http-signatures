name: any-pr

on: [pull_request]

jobs:
  build_test:
    name: Build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # pin@v5.0.0
      - name: Setup NodeJS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # pin@v5.0.0
        with:
          node-version: 18.x
          # Corepack is enabled in the next step, so setup-node must not probe the
          # global Yarn 1 for a cache dir - it errors on "packageManager": "yarn@4".
          package-manager-cache: false
      - name: Enable corepack
        run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn license:check
      - run: yarn build
      - run: yarn test --coverage
