# No git-protocol dependencies: an empty allowlist keeps Yarn from writing
# back the permissive "**" default on the next lockfile-mutating command.
approvedGitRepositories: []

enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 4320

npmRegistryServer: "https://registry.npmjs.org"

# First-party packages are exempt from the minimum-age gate above: we control
# their releases, so the delay only blocks us from consuming a fresh one.
npmScopes:
  mattrglobal:
    npmMinimalAgeGate: 0
    # Defining a scope stops it inheriting the top-level npmRegistryServer,
    # so it is repeated here rather than falling back to registry.yarnpkg.com.
    npmRegistryServer: "https://registry.npmjs.org"
